<!doctype html><html lang=pl><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Proces Rinvo: prototyp przepływu</title><style>
:root{--tlo:#E9EDF1;--ark:#fff;--at:#14213D;--sz:#5B6675;--zol:#F2B705}
*{box-sizing:border-box}body{margin:0;background:var(--tlo);color:var(--at);font:16px/1.5 "Avenir Next","Segoe UI",system-ui,sans-serif;padding:16px}
main{max-width:880px;margin:0 auto;background:var(--ark);border-radius:12px;padding:24px}
h1{font-size:1.4rem;margin:0 0 4px}.lead{color:var(--sz);margin:0 0 20px}
.flow{display:flex;flex-wrap:wrap;gap:8px;align-items:stretch}
.step{font:inherit;color:var(--at);background:var(--ark);border:2px solid var(--at);border-radius:10px;padding:10px 12px;cursor:pointer;display:flex;gap:8px;align-items:center;text-align:left}
.step .num{width:24px;height:24px;border-radius:50%;background:var(--tlo);display:grid;place-items:center;font-size:.85rem;flex:none}
.step[aria-pressed=true]{background:var(--zol);border-color:var(--at)}.step[aria-pressed=true] .num{background:var(--ark)}
.step:not(:last-child):not(.side)::after{content:"→";color:var(--sz);margin-left:4px}
.side{border-style:dashed;border-color:var(--sz);margin-left:auto}
button:focus-visible{outline:3px solid var(--at);outline-offset:2px}
#p{margin-top:20px;border-top:1px solid var(--tlo);padding-top:16px}#p h2{margin:0;font-size:1.15rem}#p .d{color:var(--sz);margin:2px 0 12px}
pre{background:var(--tlo);padding:12px;border-radius:8px;overflow-x:auto;white-space:pre-wrap;word-break:break-word;font:.85rem/1.5 ui-monospace,Menlo,monospace;margin:8px 0}
.n{color:var(--sz)}.ok,.bad,.card{border:1px solid var(--sz);border-radius:8px;padding:10px 12px;margin:8px 0}.ok{border-left:6px solid var(--at)}.bad{border-left:6px solid var(--sz);border-style:dashed}
.card small{color:var(--sz)}li{margin:4px 0}
@media(max-width:560px){main{padding:16px}.step{width:100%}.step::after{display:none}.side{margin-left:0}}
</style></head><body><main><h1>Jak działa proces</h1><p class=lead>Kliknij krok, żeby zobaczyć prawdziwy przykład z danych Auto Tama.</p>
<nav class=flow aria-label="Kroki procesu"><button class=step data-k=1 aria-pressed=false><span class=num>1</span>Transkrypcja</button><button class=step data-k=2 aria-pressed=false><span class=num>2</span>Ekstrakcja</button><button class=step data-k=3 aria-pressed=false><span class=num>3</span>Walidacja i cytaty</button><button class=step data-k=4 aria-pressed=false><span class=num>4</span>wyniki.json</button><button class=step data-k=5 aria-pressed=false><span class=num>5</span>raport.html</button><button class=step data-k=6 aria-pressed=false><span class=num>6</span>Człowiek zatwierdza</button><button class="step side" data-k=E aria-pressed=false><span class=num>+</span>Ewaluacja</button></nav><section id=p aria-live=polite></section></main>
<script>const D={"1": {"t": "Transkrypcja", "d": "Surowy tekst spotkania, bez obróbki.", "h": "<p>W jednej rozmowie ustalenie pada dwa razy. Ważne jest to późniejsze.<\/p><pre>Kasia: Toruńska 120. Godziny bez zmian, w tygodniu dziewiąta–osiemnasta, sobota dziewiąta–czternasta.\n[...]\nMarek: Dobra. Tydzień dziewiąta–dziewiętnasta, sobota dziewiąta–czternasta. Zmienię po callu.\n[...]\nKasia: Dokładnie. A, jeszcze wracając do godzin dzwonienia. Sobotę jednak zostaw do piętnastej, nie do czternastej. Od tego miesiąca salon w sobotę jest do piętnastej, zapomniałam.\n\nMarek: Czyli sobota dziewiąta–piętnasta, tydzień dziewiąta–dziewiętnasta.<\/pre><p class=n>Wniosek: sobota kończy się o 15, nie o 14. Liczy się ostatnia wypowiedź.<\/p>"}, "2": {"t": "Ekstrakcja", "d": "claude -p dostaje transkrypcję, kalendarz dat i prompt.", "h": "<p>Kalendarz pozwala zamienić „dzisiaj” czy „do piątku” na konkretną datę (spotkanie: 6.10.2026):<\/p><pre>2026-10-06 wtorek\n2026-10-07 środa\n2026-10-08 czwartek\n2026-10-09 piątek<\/pre><p>Fragment reguł z promptu:<\/p><ul><li>Późniejsze wypowiedzi nadpisują wcześniejsze. W opis zapisz stan końcowy po wszystkich nadpisaniach.<\/li><li>Cytaty: DOSŁOWNY fragment transkrypcji, jedna wypowiedź, bez sklejania różnych miejsc, bez parafrazy.<\/li><li>Brak terminu w rozmowie oznacza null, nigdy nie zgaduj terminu.<\/li><\/ul>"}, "3": {"t": "Walidacja i cytaty", "d": "Kod sprawdza kształt danych i szuka każdego cytatu w transkrypcji.", "h": "<div class=ok><b>zweryfikowany<\/b><pre>Dokładnie. A, jeszcze wracając do godzin dzwonienia. Sobotę jednak zostaw do piętnastej, nie do czternastej. Od tego miesiąca salon w sobotę jest do piętnastej, zapomniałam.<\/pre>Jest w transkrypcji znak w znak.<\/div><div class=bad><b>niezweryfikowany (przykład wymyślony)<\/b><pre>Sobotę jednak zostaw do piętnastej. Zmienię po callu.<\/pre>To sklejka dwóch wypowiedzi z różnych miejsc. Nie występuje w tekście, więc element dostaje flagę cytaty_zweryfikowane: false i trafia do przeglądu.<\/div>"}, "4": {"t": "wyniki.json", "d": "Jedno źródło prawdy: lista elementów ze statusem, właścicielem, terminem i cytatami.", "h": "<p>Jeden element z prawdziwego pliku (cytaty skrócone do jednego):<\/p><pre>{\n  &quot;id&quot;: &quot;E03&quot;,\n  &quot;typ&quot;: &quot;zmiana konfiguracji&quot;,\n  &quot;status&quot;: &quot;teraz&quot;,\n  &quot;tytul&quot;: &quot;Skrócenie godzin dzwonienia agenta&quot;,\n  &quot;skrot&quot;: &quot;Ustawić godziny dzwonienia: pn–pt 9–19, sobota 9–15, niedziela bez połączeń.&quot;,\n  &quot;wlasciciel&quot;: &quot;Marek&quot;,\n  &quot;termin&quot;: &quot;2026-10-06&quot;,\n  &quot;termin_opis&quot;: &quot;po callu, dzisiaj&quot;,\n  &quot;do_klienta&quot;: true,\n  &quot;cytaty&quot;: [\n    &quot;Dokładnie. A, jeszcze wracając do godzin dzwonienia. Sobotę jednak zostaw do piętnastej, nie do czternastej. Od tego miesiąca salon w sobotę jest do piętnastej, zapomniałam.&quot;\n  ],\n  &quot;cytaty_zweryfikowane&quot;: true\n}<\/pre>"}, "5": {"t": "raport.html", "d": "Szkice dla człowieka: karty elementów i szkic maila do klienta.", "h": "<div class=card><b>Skrócenie godzin dzwonienia agenta<\/b><p>Ustawić godziny dzwonienia: pn–pt 9–19, sobota 9–15, niedziela bez połączeń.<\/p><small>właściciel: Marek · termin: 2026-10-06 (po callu, dzisiaj) · cytaty: zweryfikowane<\/small><\/div><p>Początek szkicu maila:<\/p><pre>Cześć,\n\ndzięki za rozmowę 6.10. W skrócie, co ustaliliśmy:\n\nPo naszej stronie:<\/pre>"}, "6": {"t": "Człowiek zatwierdza", "d": "Ostatnie słowo ma człowiek. Nic nie jest wysyłane automatycznie.", "h": "<ul><li>Czyta kartę i sprawdza cytat obok.<\/li><li>Poprawia skrót, właściciela albo termin, jeśli trzeba.<\/li><li>Zatwierdza lub odrzuca każdy element.<\/li><li>Mail kopiuje i wysyła sam. Narzędzie niczego nie wysyła.<\/li><\/ul>"}, "E": {"t": "Ewaluacja", "d": "Osobno: porównanie wyniku z oczekiwane.json, ręcznie opisanym wzorcem.", "h": "<pre>[2/3] Raport...\nZapisano ./raport.html\n[3/3] Ewaluacja względem oczekiwane.json...\n✅ 1. Godziny dzwonienia pn-pt 9-19, sobota 9-15, niedziela nie; godziny salonu sobota do 15 (oba salony); brak soboty do 14\n✅ 2. Adres Włocławek Toruńska 120; po poprawce napisać do Kasi\n✅ 3. Błąd: ponowne dzwonienie po rozłączeniu w 3 s; 6 przypadków, 16:40, numer na 14, limit 5 prób bez zmian\n...\nWynik: 15/15<\/pre><p class=n>Ewaluacja nie jest częścią przepływu. Sprawdza, czy zmiana promptu nie pogorszyła wyników.<\/p>"}};const p=document.getElementById('p');
function show(k){document.querySelectorAll('.step').forEach(b=>b.setAttribute('aria-pressed',b.dataset.k===k));
const x=D[k];p.innerHTML='<h2></h2><p class=d></p><div>'+x.h+'</div>';p.querySelector('h2').textContent=x.t;p.querySelector('.d').textContent=x.d;}
document.querySelectorAll('.step').forEach(b=>b.onclick=()=>show(b.dataset.k));show('1');</script></body></html>
